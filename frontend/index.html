
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRJ12 - Busca Geoespacial de Voos</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Leaflet Draw CSS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Busca Geoespacial de Voos</h1>
        <p>Selecione uma região no mapa para encontrar cidades, companhias aéreas e turnos.</p>
    </header>
    
    <main>
        <div class="content-layout">

            <!-- Mapa -->
            <section class="map-section">
                <h2>Mapa de cidades</h2>

                <div id="map"></div>

                <button id="search-button">
                    Buscar cidades na região
                </button>
            </section>

            <!-- Cadastro de cidades -->
            <section class="register-section">
                <h2>Cadastrar cidade</h2>

                <form id="city-form">

                    <div class="form-group">
                        <label for="city-name">Nome da cidade</label>
                        <input
                            type="text"
                            id="city-name"
                            placeholder="Ex.: Santos"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="city-state">Estado (UF)</label>
                        <input
                            type="text"
                            id="city-state"
                            placeholder="Ex.: SP"
                            maxlength="2"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="city-country">País</label>
                        <input
                            type="text"
                            id="city-country"
                            value="Brasil"
                            required
                        >
                    </div>

                    <button
                        type="button"
                        id="locate-city-button"
                    >
                        Localizar cidade
                    </button>

                    <p id="location-status" role="status" aria-live="polite"></p>

                    <div id="coordinates-preview" hidden>
                        <h3>Localização encontrada</h3>
                        <p id="latitude-preview"></p>
                        <p id="longitude-preview"></p>
                    </div>

                    <button
                        type="submit"
                        id="register-city-button"
                        disabled
                    >
                        Cadastrar cidade
                    </button>

                </form>

                <p class="geocoding-attribution">
                    Geocodificação: © OpenStreetMap contributors
                </p>
            </section>

        </div>

        <!-- Resultados da busca geoespacial -->
        <section class="results-section">
            <h2>Resultados da busca</h2>

            <div id="results">
                <p>Desenhe uma região no mapa para iniciar a busca.</p>
            </div>
        </section>
    </main>


    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Draw JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script src="js/map.js"></script>

</body>
</html>
